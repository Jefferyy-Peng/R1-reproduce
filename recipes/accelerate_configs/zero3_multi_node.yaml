compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0  # Machine 1 (Master) → Set machine_rank=1 on the second machine
main_training_function: main
mixed_precision: bf16
num_machines: 2  
num_processes: 8
rdzv_backend: static
same_network: true
main_process_ip: "dreal3.cis.udel.edu"  # Set this to the IP of Machine 1 (Master)
main_process_port: 29500  # Ensure both machines use the same port
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
